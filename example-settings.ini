[settings]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;    ALCHEMIST CONFIGURATION    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; AWS Credentials and Services
; ----------------------------
; AWS credentials for alchemist & cascflow
AWS_ACCESS_KEY_ID=YOUR_AWS_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY=YOUR_AWS_SECRET_ACCESS_KEY

; AWS Resources
; -------------
; CloudFront distribution ID (optional)
ALCHEMIST_CLOUDFRONT_DISTRIBUTION_ID=YOUR_CLOUDFRONT_DISTRIBUTION_ID

; S3 bucket for storing files
S3_BUCKET=your-alchemist-bucket-name

; Base URLs and Endpoints
; -----------------------
; Base URL for the Alchemist application
ALCHEMIST_BASE_URL=https://your-domain.example.org/

; Path prefix for Alchemist resources
COMMON_PATH_PREFIX=collections

; IIIF (International Image Interoperability Framework) endpoint
ALCHEMIST_IIIF_ENDPOINT=https://your-iiif-server.example.org/iiif/2/

; ArchivesSpace Configuration
; ---------------------------
; Public URL for ArchivesSpace
ARCHIVESSPACE_PUBLIC_URL=https://your-archivesspace.example.org

; Staff URL for ArchivesSpace
ARCHIVESSPACE_STAFF_URL=https://your-archivesspace.example.org/staff

; External Tools/Commands
; -----------------------
; ImageMagick command path (for image processing)
MAGICK_CMD=/usr/local/bin/magick

; s5cmd command path (for S3 operations)
S5CMD_CMD=/usr/bin/s5cmd

; VIPS command path (for image processing)
VIPS_CMD=/usr/bin/vips

; FFprobe command path (for video metadata)
FFPROBE_CMD=/usr/bin/ffprobe

; FFmpeg command path (for video processing)
FFMPEG_CMD=/usr/bin/ffmpeg

[loggers]
keys=root,alchemist

[handlers]
keys=console,file

[formatters]
keys=console,file

[logger_root]
level=DEBUG
handlers=console

[logger_alchemist]
level=DEBUG
handlers=console,file
qualname=alchemist
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=console
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=file
args=('./alchemist.log', 'a', 1000000, 9, 'utf-8')

[formatter_console]
format=%(asctime)s - %(name)s:%(lineno)d %(funcName)s - %(levelname)s - %(message)s
datefmt=

[formatter_file]
format=%(asctime)s - %(name)s:%(lineno)d %(funcName)s - %(levelname)s - %(message)s
datefmt=
