[settings]

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;    ALCHEMIST CONFIGURATION    ;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

; AWS Credentials and Services
; ----------------------------
; AWS credentials for alchemist & cascflow
AWS_ACCESS_KEY_ID=YOUR_AWS_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY=YOUR_AWS_SECRET_ACCESS_KEY

; AWS Resources
; -------------
; CloudFront distribution ID (optional)
ALCHEMIST_CLOUDFRONT_DISTRIBUTION_ID=YOUR_CLOUDFRONT_DISTRIBUTION_ID

; CloudFront distribution ID fronting the IIIF endpoint (optional; only needed
; when invalidating IIIF image paths for the "files" publication target)
IIIF_CLOUDFRONT_DISTRIBUTION_ID=YOUR_IIIF_CLOUDFRONT_DISTRIBUTION_ID

; S3 bucket for storing Alchemist files
ALCHEMIST_BUCKET=your-alchemist-bucket-name

; Base URLs and Endpoints
; -----------------------
; Base URL for the Alchemist application
ALCHEMIST_BASE_URL=https://your-domain.example.org/

; IIIF (International Image Interoperability Framework) endpoint
ALCHEMIST_IIIF_ENDPOINT=https://your-iiif-server.example.org/iiif/2/

; ArchivesSpace Configuration
; ---------------------------
; Public URL for ArchivesSpace
ARCHIVESSPACE_PUBLIC_URL=https://your-archivesspace.example.org
; Staff URL for ArchivesSpace
ARCHIVESSPACE_STAFF_URL=https://your-archivesspace.example.org/staff
; ArchivesSpace Repository ID
ARCHIVESSPACE_REPOSITORY_ID=2
; Base URL for the ArchivesSpace API
ARCHIVESSPACE_API_URL=https://your-archivesspace.example.org/api
; ArchivesSpace API credentials
ARCHIVESSPACE_USERNAME=your_username
ARCHIVESSPACE_PASSWORD=your_password

; ARK Configuration
; -----------------
; ARK namespace and minting parameters (shared with distillery)
OUR_NMA=n2t.net
OUR_NAAN=your-naan-number

; ARK shoulder (optional)
OUR_SHOULDER=your-shoulder

; S3 bucket used for ARK resolver redirects
RESOLVER_BUCKET=your-ark-resolver-bucket

; External Tools/Commands
; -----------------------
; ImageMagick command path (for image processing)
MAGICK_CMD=/usr/local/bin/magick

; s5cmd command path (for S3 operations)
S5CMD_CMD=/usr/bin/s5cmd

; VIPS command path (for image processing)
VIPS_CMD=/usr/bin/vips

; FFprobe command path (for video metadata)
FFPROBE_CMD=/usr/bin/ffprobe

; FFmpeg command path (for video processing)
FFMPEG_CMD=/usr/bin/ffmpeg

; Files Configuration
; ----------------------
; Path configuration for cascflow operations. SOURCE_MOUNT_PARENT is the
; parent of the mounted volume named on the command line, under which the
; source and batch directories below are found.
SOURCE_MOUNT_PARENT=/mnt/your-mount-parent
RELATIVE_SOURCE_DIRECTORY=your-source-directory
RELATIVE_BATCH_DIRECTORY=your-batch-directory

; File management (optional)
FILES_TO_REMOVE=.DS_Store,Thumbs.db

; Analytics (optional)
; ---------------------
; Matomo instance and site ID for the image tracker on generated pages; the
; tracker is left out unless both are set
;MATOMO_URL=https://your-matomo.example.org/
;MATOMO_SITE_ID=1

[loggers]
keys=root,alchemist

[handlers]
keys=console,file

[formatters]
keys=console,file

[logger_root]
level=DEBUG
handlers=console

[logger_alchemist]
level=DEBUG
handlers=console,file
qualname=alchemist
propagate=0

[handler_console]
class=StreamHandler
level=INFO
formatter=console
args=(sys.stdout,)

[handler_file]
class=handlers.RotatingFileHandler
level=DEBUG
formatter=file
args=('./alchemist.log', 'a', 1000000, 9, 'utf-8')

[formatter_console]
format=%(message)s
datefmt=

[formatter_file]
format=%(asctime)s - %(name)s:%(lineno)d %(funcName)s - %(levelname)s - %(message)s
datefmt=
