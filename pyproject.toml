[project]
name = "alchemist"
version = "3.0.8"
description = "Caltech Archives Publication & Access System"
readme = "README.md"
authors = [
    { name = "Tommy Keswick", email = "tkeswick@caltech.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "cascflow",
    "jinja2>=3.1",
    "python-decouple-typed>=3.11.0",
]

[tool.uv.sources]
cascflow = { git = "https://github.com/caltechlibrary/cascflow", branch = "main" }

[dependency-groups]
dev = [
    "ruff>=0.12",
]
