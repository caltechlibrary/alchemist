[project]
name = "alchemist"
version = "3.0.9"
description = "Caltech Archives Publication & Access System"
readme = "README.md"
authors = [
    { name = "Tommy Keswick", email = "tkeswick@caltech.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "cascflow",
    "jinja2",
    "python-decouple",
]

[tool.uv.sources]
cascflow = { git = "https://github.com/caltechlibrary/cascflow", rev = "v4.0.0" }

[dependency-groups]
dev = [
    "decouple-types",
    "pytest",
    "ruff",
]
