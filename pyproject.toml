[project]
name = "alchemist"
version = "3.6.0"
description = "Caltech Archives Publication & Access System"
readme = "README.md"
authors = [
    { name = "Tommy Keswick", email = "tkeswick@caltech.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "arkminter",
    "boto3",
    "cascflow",
    "jinja2",
    "python-decouple",
]

[tool.uv.sources]
arkminter = { git = "https://github.com/caltechlibrary/arkminter", tag = "v1.0.0" }
cascflow = { git = "https://github.com/caltechlibrary/cascflow", tag = "v5.0.0" }

[dependency-groups]
dev = [
    "aws-cdk-lib",
    "decouple-types",
    "pytest",
    "ruff",
]
