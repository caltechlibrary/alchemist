[project]
name = "alchemist"
version = "3.1.0"
description = "Caltech Archives Publication & Access System"
readme = "README.md"
authors = [
    { name = "Tommy Keswick", email = "tkeswick@caltech.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "arkminter",
    "boto3",
    "cascflow",
    "jinja2",
    "python-decouple",
]

[tool.uv.sources]
arkminter = { path = "../arkminter", editable = true }
cascflow = { path = "../cascflow", editable = true }

[dependency-groups]
dev = [
    "aws-cdk-lib",
    "decouple-types",
    "pytest",
    "ruff",
]
